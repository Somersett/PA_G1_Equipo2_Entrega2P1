# Entrada única: los clientes solo llegan por el panel (admin-web, :3000 -> /api/graphql) o por el GraphQL
# Gateway (:8080). Consolidated Queries y el simulador de servicios no publican puertos: solo los alcanza el
# gateway dentro de la red de Compose. PostgreSQL y Kafka se publican únicamente en 127.0.0.1 (este equipo)
# para herramientas de desarrollo y para ejecutar servicios fuera de Docker; no son accesibles desde la red.
#
# Tolerancia a fallos: todos los contenedores se reinician solos si se caen (restart: unless-stopped), salvo
# que se detengan a mano (docker compose stop / detener.bat).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
      POSTGRES_DB: postgres
    # Puertos del host configurables en .env por si ya están ocupados (p. ej. un PostgreSQL instalado).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gym_user -d queries_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: clientes en el host (localhost:9092). INTERNAL: contenedores de la red de Compose (kafka:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Aplicaciones implementadas. Se levantan con: docker compose --profile apps up -d --build
  # Requieren infrastructure/.env (copiar de .env.example).
  consolidated-queries-service:
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ../services/consolidated-queries-service
    environment:
      QUERIES_DB_URL: jdbc:postgresql://postgres:5432/queries_db
      QUERIES_DB_USERNAME: ${QUERIES_DB_USERNAME:-}
      QUERIES_DB_PASSWORD: ${QUERIES_DB_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QUERIES_API_USERNAME: ${QUERIES_API_USERNAME:-}
      QUERIES_API_PASSWORD: ${QUERIES_API_PASSWORD:-}
    # API interna sin puerto publicado: solo la llama el GraphQL Gateway dentro de la red de Compose.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  graphql-gateway:
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ..
      dockerfile: gateways/graphql-gateway/Dockerfile
    environment:
      CONSOLIDATED_QUERIES_BASE_URL: http://consolidated-queries-service:8085
      QUERIES_API_USERNAME: ${QUERIES_API_USERNAME:-}
      QUERIES_API_PASSWORD: ${QUERIES_API_PASSWORD:-}
      GATEWAY_CLIENT_USERNAME: ${GATEWAY_CLIENT_USERNAME:-}
      GATEWAY_CLIENT_PASSWORD: ${GATEWAY_CLIENT_PASSWORD:-}
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      # "local" habilita GraphiQL (application-local.yml); por defecto queda desactivado.
      SPRING_PROFILES_ACTIVE: ${GATEWAY_SPRING_PROFILES_ACTIVE:-default}
      # Members, Memberships, Payments y Access Control (hoy, el simulador). El gateway usa la credencial
      # administrativa que esos servicios exigen; en el simulador es la misma de los clientes del gateway.
      GYM_PLATFORM_BASE_URL: http://services-simulator:8090
      GYM_PLATFORM_USERNAME: ${GATEWAY_CLIENT_USERNAME:-}
      GYM_PLATFORM_PASSWORD: ${GATEWAY_CLIENT_PASSWORD:-}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    # Solo orden de arranque: el gateway no necesita a los servicios para iniciar. Si alguno no está listo,
    # lo informa en systemStatus y responde UPSTREAM_UNAVAILABLE en sus operaciones hasta que vuelva.
    depends_on:
      consolidated-queries-service:
        condition: service_started
      services-simulator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Simulador de Members, Memberships, Payments y Access Control (los cuatro servicios sin implementar).
  # Implementa el contrato REST y produce/consume los eventos Kafka del contrato, cada módulo con su base.
  # Sin puerto publicado: solo lo llama el GraphQL Gateway dentro de la red de Compose.
  services-simulator:
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ../simulator
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${SIMULATOR_DB_USERNAME:-gym_user}
      DB_PASSWORD: ${SIMULATOR_DB_PASSWORD:-gym_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Credencial HTTP Basic de las operaciones administrativas; la presenta el gateway (GYM_PLATFORM_*).
      ADMIN_USERNAME: ${GATEWAY_CLIENT_USERNAME:-}
      ADMIN_PASSWORD: ${GATEWAY_CLIENT_PASSWORD:-}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-America/Bogota}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Panel administrativo (React + nginx). Entrada única para el navegador: http://localhost:3000
  # Todas sus llamadas van al GraphQL Gateway (/api/graphql).
  admin-web:
    profiles: ["apps"]
    restart: unless-stopped
    build:
      context: ../clients/admin-web
    ports:
      - "${ADMIN_WEB_PORT:-3000}:80"
    depends_on:
      graphql-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Herramientas a pedido (no forman parte de la solución ni arrancan con iniciar.*). Hablan solo con el
  # GraphQL Gateway, igual que el panel:
  #   datos ficticios:  docker compose --profile apps --profile herramientas run --rm herramientas
  #   latencias:        docker compose --profile apps --profile herramientas run --rm herramientas medir-latencias.mjs
  herramientas:
    profiles: ["herramientas"]
    image: node:22-alpine
    working_dir: /herramientas
    volumes:
      - ../scripts/herramientas:/herramientas:ro
    environment:
      GATEWAY_URL: http://graphql-gateway:8080/graphql
      GATEWAY_CLIENT_USERNAME: ${GATEWAY_CLIENT_USERNAME:-}
      GATEWAY_CLIENT_PASSWORD: ${GATEWAY_CLIENT_PASSWORD:-}
    entrypoint: ["node"]
    command: ["datos-demo.mjs"]
    depends_on:
      graphql-gateway:
        condition: service_healthy

volumes:
  postgres-data:
