openapi: 3.0.3
info:
  title: Gym Platform REST API
  version: 0.1.0
  description: >-
    Contrato inicial unificado para las operaciones REST transaccionales de
    Members, Memberships, Payments y Access Control. El contrato corresponde
    al MVP definido en la Entrega 2.
tags:
  - name: Members
    description: Registro y consulta de miembros.
  - name: Plans
    description: Catálogo de planes de membresía.
  - name: Memberships
    description: Creación y consulta de membresías.
  - name: Payments
    description: Registro y consulta de pagos administrativos o simulados.
  - name: Access Control
    description: Validación simulada y registro de intentos de acceso.
security:
  - basicAuth: []
paths:
  /members:
    post:
      tags: [Members]
      summary: Registrar un miembro
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Miembro registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Members]
      summary: Consultar miembros
      operationId: listMembers
      responses:
        '200':
          description: Lista de miembros registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [Members]
      summary: Consultar un miembro por identificador
      operationId: getMemberById
      responses:
        '200':
          description: Miembro encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /plans:
    post:
      tags: [Plans]
      summary: Crear un plan
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Plans]
      summary: Listar planes
      operationId: listPlans
      responses:
        '200':
          description: Lista de planes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memberships:
    post:
      tags: [Memberships]
      summary: Crear una membresía en estado PENDING
      operationId: createMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembershipRequest'
      responses:
        '201':
          description: Membresía creada en estado PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Memberships]
      summary: Consultar membresías
      operationId: listMemberships
      responses:
        '200':
          description: Lista de membresías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /memberships/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    get:
      tags: [Memberships]
      summary: Consultar una membresía por identificador
      operationId: getMembershipById
      responses:
        '200':
          description: Membresía encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /payments:
    post:
      tags: [Payments]
      summary: Registrar un pago
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Pago registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Payments]
      summary: Consultar pagos
      operationId: listPayments
      responses:
        '200':
          description: Lista de pagos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    get:
      tags: [Payments]
      summary: Consultar un pago por identificador
      operationId: getPaymentById
      responses:
        '200':
          description: Pago encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /access-attempts:
    post:
      tags: [Access Control]
      summary: Validar y registrar un intento de acceso
      operationId: createAccessAttempt
      description: >-
        Decide el acceso con el estado local mantenido por Access Control. No
        requiere autenticación básica porque representa al simulador del punto
        de ingreso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
      responses:
        '200':
          description: Intento evaluado y registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      description: Identificador del miembro.
      schema:
        type: integer
        format: int64
        minimum: 1
    MembershipId:
      name: membershipId
      in: path
      required: true
      description: Identificador de la membresía.
      schema:
        type: integer
        format: int64
        minimum: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Identificador del pago.
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Solicitud mal formada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Se requiere autenticación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: La operación no está autorizada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: La solicitud no cumple una regla del dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error interno del servicio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateMemberRequest:
      type: object
      additionalProperties: false
      required: [document, name, phone]
      properties:
        document:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
    MemberResponse:
      type: object
      additionalProperties: false
      required: [id, document, name, phone, createdAt]
      properties:
        id:
          type: integer
          format: int64
        document:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [name, durationDays, price]
      properties:
        name:
          type: string
        durationDays:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
          minimum: 0
    PlanResponse:
      type: object
      additionalProperties: false
      required: [id, name, durationDays, price, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        durationDays:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
          minimum: 0
        createdAt:
          type: string
          format: date-time
    CreateMembershipRequest:
      type: object
      additionalProperties: false
      required: [memberId, planId]
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
        planId:
          type: integer
          format: int64
          minimum: 1
    MembershipStatus:
      type: string
      enum: [PENDING, ACTIVE, EXPIRED]
    MembershipResponse:
      type: object
      additionalProperties: false
      required: [id, memberId, planId, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        planId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/MembershipStatus'
        startDate:
          type: string
          format: date
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [membershipId, amount, paidAt]
      properties:
        membershipId:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: number
          format: double
          minimum: 0
        paidAt:
          type: string
          format: date-time
    PaymentResponse:
      type: object
      additionalProperties: false
      required: [id, membershipId, amount, paidAt, createdAt]
      properties:
        id:
          type: integer
          format: int64
        membershipId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          minimum: 0
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    AccessRequest:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId:
          type: integer
          format: int64
          minimum: 1
    AccessResult:
      type: string
      enum: [ACCESS_GRANTED, ACCESS_DENIED]
    AccessResponse:
      type: object
      additionalProperties: false
      required: [attemptId, memberId, result, reason, occurredAt]
      properties:
        attemptId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        result:
          $ref: '#/components/schemas/AccessResult'
        reason:
          type: string
        occurredAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
